name: Build Vibe CI
on:
  push:
    branches: [main, master, codex/launch-verify-final, codex/final-source-13, phase-14-ai-studio-postgres]
  pull_request:
    branches: [main, master]
permissions:
  contents: read

concurrency:
  group: build-vibe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: buildvibe
          POSTGRES_PASSWORD: buildvibe
          POSTGRES_DB: buildvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildvibe -d buildvibe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci --no-audit --no-fund
      - name: Dependency vulnerability audit
        run: npm audit --omit=optional --audit-level=high
      - run: npm test
      - run: npm run test:coverage
      - run: npm run check
      - run: npm run seo:check
      - run: npm run e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run browser:e2e
      - run: npm run ops:load
      - run: npm run recovery:smoke
      - run: npm run deployment:preflight
      - run: npm run benchmark
      - run: npm run mirofish:status
      - run: CODINGVIBES_RETENTION_DRY_RUN=true npm run ops:retention
      - run: npm run security:check
      - run: npm run scaleout:doctor
      - name: Verify PostgreSQL bootstrap
        env:
          NODE_ENV: test
          CODINGVIBES_DB_BACKEND: postgres
          DATABASE_URL: postgresql://buildvibe:buildvibe@127.0.0.1:5432/buildvibe
          CODINGVIBES_PG_SSL_MODE: disable
        run: npm run postgres:setup
      - name: Run launch readiness
        env:
          NODE_ENV: development
          CODINGVIBES_ENABLE_BROWSER: false
        run: |
          set -euo pipefail
          npm start > /tmp/build-vibe.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4400/health >/dev/null; then break; fi
            sleep 1
          done
          test "$i" -le 30
          npm run launch:check
