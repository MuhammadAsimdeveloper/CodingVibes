name: Build Vibe CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read

concurrency:
  group: build-vibe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run e2e
      - run: npm run security:check
      - name: Run launch readiness
        env:
          NODE_ENV: development
          CODINGVIBES_ENABLE_BROWSER: false
        run: |
          npm start > /tmp/build-vibe.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4400/health >/dev/null; then break; fi
            sleep 1
          done
          test "$i" -le 30
          npm run launch:check
