name: Build Vibe CI
on:
  push:
    branches: [main, master, codex/launch-complete-13]
  pull_request:
    branches: [main, master]
permissions:
  contents: read

concurrency:
  group: build-vibe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-lockfile:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Generate package-lock.json when absent
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            echo "package-lock.json already exists; nothing to bootstrap."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add npm lockfile"
          git push

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json is not present yet; using npm install for this bootstrap run."
            npm install --no-audit --no-fund
          fi
      - run: npm test
      - run: npm run test:coverage
      - run: npm run check
      - run: npm run e2e
      - run: npm run security:check
      - run: npm run scaleout:doctor
      - name: Run launch readiness
        env:
          NODE_ENV: development
          CODINGVIBES_ENABLE_BROWSER: false
        run: |
          set -euo pipefail
          npm start > /tmp/build-vibe.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4400/health >/dev/null; then break; fi
            sleep 1
          done
          test "$i" -le 30
          npm run launch:check
