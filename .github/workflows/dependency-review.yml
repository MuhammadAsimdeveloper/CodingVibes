name: Dependency Review
on:
  pull_request:
    branches: [main, master]
permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: npm audit fallback
        run: npm audit --omit=optional --audit-level=high
      - name: GitHub dependency review (best effort)
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - name: Dependency review fallback note
        run: |
          echo "The GitHub Dependency Review service is optional for this repository."
          echo "npm audit is the enforceable dependency-vulnerability gate when the GitHub dependency graph is unavailable."
