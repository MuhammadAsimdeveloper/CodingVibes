name: CodeQL
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '21 2 * * 1'
permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

      - name: Summarize CodeQL finding locations
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {existsSync, readFileSync} from 'node:fs';
          const path = 'results/javascript.sarif';
          if (!existsSync(path)) {
            console.log('CodeQL SARIF summary unavailable: results/javascript.sarif was not retained by the analysis action.');
            process.exit(0);
          }
          const sarif = JSON.parse(readFileSync(path, 'utf8'));
          for (const run of sarif.runs || []) {
            const rules = new Map((run.tool?.driver?.rules || []).map(rule => [rule.id, rule]));
            for (const result of run.results || []) {
              const rule = rules.get(result.ruleId);
              console.log(JSON.stringify({
                ruleId: result.ruleId || null,
                level: result.level || null,
                securitySeverity: rule?.properties?.['security-severity'] || null,
                message: String(result.message?.text || '').slice(0, 240),
                locations: (result.locations || []).map(location => ({
                  path: location.physicalLocation?.artifactLocation?.uri || null,
                  line: location.physicalLocation?.region?.startLine || null,
                  column: location.physicalLocation?.region?.startColumn || null
                }))
              }));
            }
          }
          NODE
