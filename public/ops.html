<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coding Vibes — Operations</title><link rel="stylesheet" href="/styles.css"><style>
.ops{max-width:1200px;margin:auto;padding:28px}.ops-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.ops-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.metric{border:1px solid #243451;background:#0b1423;border-radius:14px;padding:14px}.metric strong{display:block;font-size:28px}.metric span{color:#8fa0ba;font-size:11px}.panel{border:1px solid #243451;background:#0b1423;border-radius:14px;padding:14px;margin-top:12px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid #1d2a42}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#16233b;color:#c7d8f2}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{border-color:#6a3040!important;background:#2b121b!important;color:#ffd9df!important}@media(max-width:900px){.ops-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.ops{padding:16px}.ops-grid{grid-template-columns:1fr}}
</style></head><body><main class="ops"><div class="ops-head"><div><div class="eyebrow">Coding Vibes control plane</div><h1>Operations</h1><p class="muted">Protected super-admin console for customer health, deployment state, audit events and database backups.</p></div><a class="ghost" href="/app">Back to builder</a></div><div id="error" class="panel" hidden></div><section class="ops-grid"><div class="metric"><strong id="users">—</strong><span>Customers</span></div><div class="metric"><strong id="projects">—</strong><span>Projects</span></div><div class="metric"><strong id="runs">—</strong><span>Total runs</span></div><div class="metric"><strong id="deployments">—</strong><span>Deployments</span></div></section><section class="panel"><div class="ops-head"><strong>System health</strong><span id="version" class="badge">—</span></div><div id="health" class="muted small">Loading…</div></section><section class="panel"><div class="ops-head"><strong>Deployment activity</strong><button id="backup" class="primary">Create database backup</button></div><div id="deploymentTable" class="muted small">Loading…</div></section><section class="panel"><div class="ops-head"><strong>Audit log</strong><button id="refresh" class="ghost">Refresh</button></div><div id="auditTable" class="muted small">Loading…</div></section><script type="module" src="/ops.js"></script></main></body></html>
