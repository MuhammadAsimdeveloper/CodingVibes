<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build Vibe — Secure Checkout</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#070712">
<meta name="author" content="Build Vibe">
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/page-polish.css">
</head>
<body class="page-polish checkout-page">
<main class="checkout-card" aria-live="polite">
  <div class="checkout-icon" aria-hidden="true">✦</div>
  <div class="eyebrow">SECURE CHECKOUT</div>
  <h1>Finish your Build Vibe plan.</h1>
  <p>Your hosted Paddle checkout is opening in a secure flow. Keep this window open while the payment session is prepared.</p>
  <div id="status">Preparing checkout…</div>
  <p><a class="back" href="/app">Return to Build Vibe</a></p>
</main>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script>
(() => {
  const status=document.getElementById('status');
  const params=new URLSearchParams(location.search);
  const transactionId=String(params.get('_ptxn')||'').trim();
  const token='__PADDLE_CLIENT_TOKEN__';
  const successUrl='__SITE_URL__/app?billing=success';
  if(!transactionId){status.textContent='Checkout transaction is missing.';return;}
  if(!token||token==='__PADDLE_CLIENT_TOKEN__'){status.textContent='Checkout is not configured yet. Return to the app to continue with another setup path.';return;}
  try{
    Paddle.Initialize({token,eventCallback:data=>{
      if(data?.name==='checkout.completed')status.textContent='Payment complete. Returning to Build Vibe…';
    }});
    Paddle.Checkout.open({transactionId,settings:{displayMode:'overlay',successUrl}});
  }catch(error){status.textContent='Checkout could not start. Please return to the app and try again.';}
})();
</script>
</body>
</html>
