<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin · Site owner</title><link rel="stylesheet" href="/styles.css"><style>.admin-shell{width:100%;min-width:0}.admin-shell input,.admin-shell textarea,.admin-shell select{width:100%;max-width:100%;min-width:0;box-sizing:border-box}.admin-toolbar{display:flex;flex-wrap:wrap;gap:.5rem}.admin-toolbar>*{min-width:0}.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:1rem}.admin-records,.admin-editor{min-width:0;max-width:100%}.admin-editor{width:100%;box-sizing:border-box;resize:vertical;overflow-wrap:anywhere}@media(max-width:640px){.admin-grid{grid-template-columns:minmax(0,1fr)}.admin-toolbar>*{flex:1 1 8rem}}</style></head><body><main class="container admin-shell"><div class="eyebrow">Owner portal</div><h1>Manage your site</h1><p class="lead">Private admin access. Only the configured owner can view or edit site content.</p><section id="adminAuth" class="card"><h2>Owner sign in</h2><form id="adminPasswordForm"><label>Email<input id="adminEmail" type="email" autocomplete="email" required></label><label>Password<input id="adminPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form><a id="adminGoogle" class="primary-link" href="/auth/google?admin=1" hidden>Continue with Google</a><p id="adminAuthHint" class="muted small"></p></section><section id="adminApp" hidden><div class="card"><div class="section-heading"><div><span class="eyebrow">Content</span><h2>Edit site data</h2></div><button id="adminLogout" class="tool-button">Log out</button></div><div class="admin-toolbar"><select id="adminCollection" aria-label="Content collection"></select><button id="adminNew" class="tool-button">New record</button><button id="adminDelete" class="tool-button danger-button">Delete</button><button id="adminSave" class="primary">Save</button></div><div class="admin-grid"><div id="adminRecords" class="admin-records"></div><textarea id="adminEditor" class="admin-editor" aria-label="Content record editor" spellcheck="false"></textarea></div><p id="adminStatus" class="muted small"></p></div></section></main><script type="module">
const $=s=>document.querySelector(s);let content=null,currentCollection='',currentId='';
async function api(url,init){const r=await fetch(url,init);const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'request_failed'),{status:r.status,response:j});return j}
function collections(){return Object.keys(content||{}).filter(k=>Array.isArray(content[k]))}
function records(){return Array.isArray(content?.[currentCollection])?content[currentCollection]:[]}
function renderRecords(){const box=$('#adminRecords');box.replaceChildren();for(const item of records()){const b=document.createElement('button');b.type='button';b.className='admin-record'+(item.id===currentId?' active':'');b.textContent=item.title||item.name||item.handle||item.id||'record';b.onclick=()=>{currentId=item.id;render()};box.append(b)}}
function render(){const el=$('#adminCollection');el.replaceChildren(...collections().map(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;return o}));if(!content?.[currentCollection])currentCollection=collections()[0]||'';el.value=currentCollection;renderRecords();const item=records().find(x=>x.id===currentId)||records()[0]||{};currentId=item?.id||'';$('#adminEditor').value=JSON.stringify(item,null,2)}
async function load(){const j=await api('/api/admin/content');content=j.content;currentCollection=collections()[0]||'';currentId='';render();$('#adminAuth').hidden=true;$('#adminApp').hidden=false}
$('#adminCollection').onchange=e=>{currentCollection=e.target.value;currentId='';render()};
$('#adminNew').onclick=()=>{currentId='';$('#adminEditor').value=JSON.stringify({title:'New record',status:'active'},null,2)};
$('#adminDelete').onclick=async()=>{if(!currentId)return;if(!confirm('Delete this record?'))return;const j=await api('/api/admin/content/operations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({operation:{type:'delete',collection:currentCollection,id:currentId}})});content=j.content;currentId='';render();$('#adminStatus').textContent='Deleted.'};
$('#adminSave').onclick=async()=>{let record;try{record=JSON.parse($('#adminEditor').value)}catch{$('#adminStatus').textContent='Invalid JSON.';return}try{const type=currentId?'update':'add';const operation=type==='update'?{type,collection:currentCollection,id:currentId,patch:record}:{type,collection:currentCollection,record};const j=await api('/api/admin/content/operations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({operation})});content=j.content;currentId=type==='add'?records().at(-1)?.id:currentId;render();$('#adminStatus').textContent='Saved.'}catch(e){$('#adminStatus').textContent=e.message}};
$('#adminLogout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};
$('#adminPasswordForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#adminEmail').value,password:$('#adminPassword').value})});await load()}catch(err){$('#adminAuthHint').textContent=err.message}};
(async()=>{try{const s=await api('/api/admin/session');if(s.authenticated){await load();return}if(s.googleConfigured)$('#adminGoogle').hidden=false;$('#adminAuthHint').textContent=s.ownerConfigured?'Use your owner credentials or configured Google account.':'Set CV_OWNER_EMAIL/CV_OWNER_PASSWORD or CV_GOOGLE_OWNER_EMAILS before enabling owner access.'}catch(e){$('#adminAuthHint').textContent=e.message}})();
</script></body></html>
