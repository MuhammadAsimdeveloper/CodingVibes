services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4400
      CODINGVIBES_RUNTIME: container
      CODINGVIBES_CONTAINER_IMAGE: ${CODINGVIBES_CONTAINER_IMAGE:?Set the production execution image}
    env_file:
      - ../../.env.production
    ports:
      - '4400:4400'
    volumes:
      - buildvibe_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    profiles: ['scaleout']
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: buildvibe
      POSTGRES_USER: buildvibe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U buildvibe -d buildvibe']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    profiles: ['scaleout']
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ['redis-server','--appendonly','yes','--save','60','1']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    profiles: ['scaleout']
    image: ${MINIO_IMAGE:?Set a pinned MinIO image or digest}
    command: ['server','/data','--console-address',':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  buildvibe_data:
  postgres_data:
  redis_data:
  minio_data: